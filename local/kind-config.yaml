# Cluster local de 1 nodo para probar el chart sin Azure.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: peaceapp
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
