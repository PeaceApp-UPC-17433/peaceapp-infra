# Postgres de desarrollo dentro del cluster (en AKS se usa Azure Database for PostgreSQL).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  namespace: peaceapp
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: peaceapp
data:
  01-databases.sh: |
    #!/bin/sh
    set -e
    for svc in identity incident trust alerts community notification; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<SQL
    CREATE ROLE ${svc} LOGIN PASSWORD '${svc}';
    CREATE DATABASE ${svc}_db OWNER ${svc};
    REVOKE CONNECT ON DATABASE ${svc}_db FROM PUBLIC;
    GRANT CONNECT ON DATABASE ${svc}_db TO ${svc};
    SQL
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: peaceapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # usuario postgres de la imagen alpine
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-admin
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
        # datos efimeros: es un entorno local de prueba
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: peaceapp
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
