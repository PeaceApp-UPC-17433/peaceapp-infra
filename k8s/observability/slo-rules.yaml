# SLIs, SLOs y alertas de PeaceApp (seccion 4.3 del informe).
# Las peticiones a /actuator/** (health, metricas) se excluyen de los SLIs.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: peaceapp-slo
  namespace: peaceapp
  labels:
    team: peaceapp
spec:
  groups:
    - name: peaceapp-sli.rules
      interval: 30s
      rules:
        # Throughput por servicio (peticiones/s)
        - record: peaceapp:http_requests:rate5m
          expr: sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
        # SLI de disponibilidad: proporcion de respuestas que no son 5xx
        - record: peaceapp:sli_availability:ratio_rate5m
          expr: |
            sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*", status!~"5.."}[5m]))
            /
            sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
        # SLI de latencia: proporcion de respuestas en 500 ms o menos (RNF p95 <= 500 ms)
        - record: peaceapp:sli_latency_500ms:ratio_rate5m
          expr: |
            sum by (application) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*", le="0.5"}[5m]))
            /
            sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
        # Latencia p95 por servicio
        - record: peaceapp:http_latency_p95:seconds_5m
          expr: |
            histogram_quantile(0.95,
              sum by (application, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m])))
        # Tasa de errores 5xx
        - record: peaceapp:http_errors_5xx:ratio_rate5m
          expr: 1 - peaceapp:sli_availability:ratio_rate5m

    - name: peaceapp-alerts
      rules:
        - alert: PeaceAppServiceDown
          expr: up{namespace="peaceapp"} == 0
          for: 2m
          labels: { severity: critical, team: peaceapp }
          annotations:
            summary: "{{ $labels.service }} no responde a Prometheus"
            description: "El endpoint /actuator/prometheus de {{ $labels.service }} lleva 2 minutos sin responder."
            runbook: "Runbook RB-01 (seccion 4.3)"
        - alert: PeaceAppHighErrorRate
          expr: peaceapp:http_errors_5xx:ratio_rate5m > 0.01 and peaceapp:http_requests:rate5m > 0.1
          for: 5m
          labels: { severity: critical, team: peaceapp }
          annotations:
            summary: "{{ $labels.application }}: mas de 1 % de respuestas 5xx"
            description: "La tasa de 5xx es {{ $value | humanizePercentage }} (SLO de disponibilidad 99 %)."
            runbook: "Runbook RB-02 (seccion 4.3)"
        - alert: PeaceAppHighLatencyP95
          expr: peaceapp:http_latency_p95:seconds_5m > 0.5 and peaceapp:http_requests:rate5m > 0.1
          for: 10m
          labels: { severity: warning, team: peaceapp }
          annotations:
            summary: "{{ $labels.application }}: latencia p95 sobre 500 ms"
            description: "La latencia p95 es {{ $value | humanizeDuration }} (SLO: p95 <= 500 ms)."
            runbook: "Runbook RB-03 (seccion 4.3)"
        - alert: PeaceAppPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="peaceapp"}[15m]) > 2
          labels: { severity: warning, team: peaceapp }
          annotations:
            summary: "{{ $labels.pod }} se reinicio mas de 2 veces en 15 minutos"
            runbook: "Runbook RB-04 (seccion 4.3)"
        - alert: PeaceAppJvmHeapHigh
          expr: |
            sum by (application, pod) (jvm_memory_used_bytes{area="heap"})
            / sum by (application, pod) (jvm_memory_max_bytes{area="heap"} > 0) > 0.85
          for: 10m
          labels: { severity: warning, team: peaceapp }
          annotations:
            summary: "{{ $labels.application }}: heap de la JVM sobre 85 %"
            runbook: "Runbook RB-04 (seccion 4.3)"
