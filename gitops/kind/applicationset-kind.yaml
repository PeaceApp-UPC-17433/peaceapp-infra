# Variante para el clúster local kind (evidencias del Capítulo IV): Git = Gitea en el clúster, solo trust-service,
# imagen construida en local y ambientes en peaceapp-dev / peaceapp-prod.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: peaceapp-kind
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { env: dev, service: trust-service }
          - { env: prod, service: trust-service }
  template:
    metadata:
      name: '{{.service}}-{{.env}}'
      labels:
        app.kubernetes.io/part-of: peaceapp
        environment: '{{.env}}'
    spec:
      project: default
      source:
        repoURL: http://gitea-http.gitea.svc.cluster.local:3000/gitea_admin/peaceapp-infra.git
        targetRevision: main
        path: charts/service
        helm:
          releaseName: '{{.service}}'
          ignoreMissingValueFiles: true
          valueFiles:
            - '../../deploy/values/{{.service}}.yaml'
            - '../../deploy/environments/{{.env}}.yaml'
            - '../../deploy/environments/kind.yaml'
            - '../../deploy/tags/{{.env}}/{{.service}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'peaceapp-{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff: { duration: 10s, factor: 2, maxDuration: 2m }
