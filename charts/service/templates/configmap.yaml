apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  labels: {{- include "service.labels" . | nindent 4 }}
data:
  {{- if .Values.javaOpts }}
  JAVA_TOOL_OPTIONS: {{ .Values.javaOpts | quote }}
  {{- end }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
