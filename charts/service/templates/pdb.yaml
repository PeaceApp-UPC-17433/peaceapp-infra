{{- if or (and (not .Values.autoscaling.enabled) (gt (int .Values.replicas) 1)) (and .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) 1)) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "service.selector" . | nindent 6 }}
{{- end }}
