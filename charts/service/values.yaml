name: ""
image:
  repository: ""
  tag: ""
port: 8080
replicas: 1
# HPA por CPU (templates/hpa.yaml). Apagado por defecto: solo los servicios que lo declaran escalan.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 60
runAsUser: 100
readOnlyRootFilesystem: true
env: {}
secretRef: ""
javaOpts: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
probes:
  liveness: /actuator/health/liveness
  readiness: /actuator/health/readiness
resources:
  requests:
    cpu: 100m
    memory: 384Mi
    ephemeral-storage: 64Mi
  limits:
    memory: 512Mi
    ephemeral-storage: 256Mi
ingress:
  enabled: false
  host: ""
  className: nginx
  issuer: letsencrypt
networkPolicy:
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
metrics:
  enabled: true
  path: /actuator/prometheus
imagePullSecrets:
  - name: ghcr-pull
