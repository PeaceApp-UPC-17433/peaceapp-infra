name: ""
image:
  repository: ""
  tag: ""
port: 8080
replicas: 1
runAsUser: 100
readOnlyRootFilesystem: true
env: {}
secretRef: ""
javaOpts: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
probes:
  liveness: /actuator/health/liveness
  readiness: /actuator/health/readiness
resources:
  requests:
    cpu: 100m
    memory: 384Mi
    ephemeral-storage: 64Mi
  limits:
    memory: 512Mi
    ephemeral-storage: 256Mi
ingress:
  enabled: false
  host: ""
  className: nginx
  issuer: letsencrypt
networkPolicy:
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
metrics:
  enabled: true
  path: /actuator/prometheus
  # Seccion 4.3 (observabilidad): histograma de latencias HTTP con buckets alineados a los SLOs,
  # necesario para las reglas peaceapp:sli_latency_500ms y peaceapp:http_latency_p95.
  # Un servicio que no sea Spring Boot puede desactivarlo con metrics.springApplicationJson: "".
  springApplicationJson: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true},"slo":{"http.server.requests":"100ms,250ms,500ms,1s"}}}}}'
imagePullSecrets:
  - name: ghcr-pull
