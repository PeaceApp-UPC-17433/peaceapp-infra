apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}
spec:
  acme:
    email: {{ required "email is required" .Values.email }}
    server: {{ .Values.server }}
    privateKeySecretRef:
      name: {{ .Values.name }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
